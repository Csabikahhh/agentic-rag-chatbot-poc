# Lint, format check, the offline test suite and the image build on every pull request and
# every push to main. Pushes to other branches do not trigger it, so the commits of a pull
# request are tested once, not twice.
#
# Everything runs in fake mode (scripted LLM, hashed embeddings), so CI needs no model, no
# GPU and no corpus. The live Ollama test (marker `ollama`) is deselected by default.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install the project and its dev dependencies (uv.lock, CPU-only torch)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (the required Dockerfile)
        run: docker build -t agentic-rag-chatbot:ci .

      - name: Check the image's CLI
        run: docker run --rm agentic-rag-chatbot:ci agentic-rag --version
