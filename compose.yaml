# Local stack for the agentic RAG chatbot prototype: Streamlit UI (app) plus a
# local LLM served by Ollama. The UI is published on http://localhost:8501 only.
#
# 1) Full stack. The first start pulls the chat model (several GB) into the
#    ollama-data volume; then the app downloads the corpus into corpus-data,
#    the embedding model into hf-cache, and builds the index in chroma-data
#    (minutes on the CPU) before the UI starts. Later starts reuse the volumes:
#      docker compose up --build
#
# 2) Model-free fake mode: scripted LLM and offline fake embeddings, no Ollama
#    container, no model downloads (the corpus is still downloaded, and the
#    fake-embedding index is built in seconds):
#      LLM_PROVIDER=fake EMBEDDING_PROVIDER=fake docker compose up --build --no-deps app
#    PowerShell:
#      $env:LLM_PROVIDER="fake"; $env:EMBEDDING_PROVIDER="fake"; docker compose up --build --no-deps app
#
# Optional:
# - NVIDIA GPU for Ollama: docker compose -f compose.yaml -f compose.gpu.yaml up --build
# - Ollama already running on the host instead of the ollama service:
#     docker compose run --rm --no-deps --service-ports -e OLLAMA_BASE_URL=http://host.docker.internal:11434 app
# - Settings: copy .env.example to .env (optional, never commit it). The shell
#   or .env can override LLM_PROVIDER, EMBEDDING_PROVIDER and OLLAMA_MODEL here.
#   OLLAMA_BASE_URL always points at the ollama service inside this stack.
# - The Ollama API is not published on the host: the host may already run Ollama
#   on 11434 and the API has no authentication. To reach it from the host, put
#   this in a local compose.override.yaml (merged automatically):
#     services:
#       ollama:
#         ports:
#           - "127.0.0.1:11435:11434"
# - Rebuild the index from scratch, e.g. after changing EMBEDDING_MODEL (a
#   start-up does that by itself) or to start over:
#     docker compose run --rm --no-deps app agentic-rag ingest --rebuild
# - Remove the containers, the corpus and all downloaded models and indexes:
#     docker compose down -v
#
# Portions adapted from the asset compose-dev.yaml of the
# docker-project-foundations skill (https://github.com/docker/skills), licensed
# under the Apache License, Version 2.0
# (https://www.apache.org/licenses/LICENSE-2.0). Modified for this project.

# Single pin for both Ollama services.
x-ollama-image: &ollama-image ollama/ollama:0.35.0

services:
  ollama:
    image: *ollama-image
    volumes:
      - ollama-data:/root/.ollama
    # No ports: reachable as http://ollama:11434 on the Compose network only.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

  # One-shot: pulls the chat model unless the ollama-data volume already has it,
  # so later starts work offline. Re-pull a model with
  #   docker compose exec ollama ollama pull <model>
  ollama-pull:
    image: *ollama-image
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama show "$$OLLAMA_MODEL" > /dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # UID and GID of the app user in the image (default 10001). A bind mount
      # keeps the owner of the host directory on a Linux engine, so for a
      # writable bind mount (such as ./data/eval) build with your own IDs:
      #   APP_UID=$(id -u) APP_GID=$(id -g) docker compose up --build
      # Named volumes take their owner from the image only while they are
      # empty: once corpus-data, chroma-data and hf-cache hold data, they keep
      # the old IDs after an ID change. docker compose down -v resets them, but
      # also deletes the corpus, the index and all downloaded models (ollama-data
      # too). To keep them, change the owner in place:
      #   docker compose run --rm --no-deps --user root app chown -R "$(id -u):$(id -g)" /app/data/raw /app/data/chroma_db /home/app/.cache/huggingface
      args:
        APP_UID: "${APP_UID:-10001}"
        APP_GID: "${APP_GID:-10001}"
    ports:
      - "127.0.0.1:8501:8501" # Use 0.0.0.0 only when other devices need access
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-huggingface}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_BASE_URL: http://ollama:11434
      # The container's paths are the volumes below, whatever .env sets for the
      # host. One index directory per embedding provider, so switching between
      # the full stack and fake mode does not rebuild the index every time.
      DATA_DIR: /app/data/raw
      CHROMA_DIR: /app/data/chroma_db/${EMBEDDING_PROVIDER:-huggingface}
    volumes:
      # Corpus, Chroma index and Hugging Face model cache survive container
      # rebuilds. The app downloads the corpus at start-up (INGEST_ON_START).
      # Paths match the Dockerfile (WORKDIR /app, HF_HOME).
      - corpus-data:/app/data/raw
      - chroma-data:/app/data/chroma_db
      - hf-cache:/home/app/.cache/huggingface
    extra_hosts:
      # For the host-Ollama option above. Docker Desktop resolves this name
      # itself; Linux engines need the mapping (the host Ollama must then
      # listen on the Docker bridge, not only on 127.0.0.1).
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama-data:
  corpus-data:
  chroma-data:
  hf-cache:
